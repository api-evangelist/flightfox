aid: flightfox
name: Flightfox
description: >-
  Flightfox is a managed travel platform for complex group travel, headquartered
  in Boulder, Colorado. It helps educational institutions, humanitarian and
  faith-based organizations, and corporate teams book and manage flights, hotels,
  and ground travel through a combination of self-serve booking software and
  24/7 human travel-agent support. Flightfox emphasizes lowest-fare guarantees,
  bulk and group booking discounts, real-time flight tracking and travel alerts,
  branded booking pages, and custom reporting including CO2 emissions and flight
  manifests. The company was originally a Y Combinator and a16z-backed crowdsourced
  flight-search marketplace and has since pivoted to full-service managed group
  travel. It does not currently publish a public developer API, SDKs, or developer
  documentation.
